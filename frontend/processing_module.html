<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA-REG — Mission Image Processing Module</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mission_hud.css">
  <link rel="stylesheet" href="css/processing_module.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Mission Control Header -->
    <header class="mission-header">
      <div class="brand-section">
        <div class="mission-crest" title="ISRO Lunar Surface Mission Control">
          <span class="crest-moon">☽</span>
        </div>
        <div class="brand-titles">
          <div class="brand-title-row">
            <span class="brand-name">LUNA-REG</span>
            <span class="brand-sub">Mission Image Processing Module</span>
          </div>
        </div>
      </div>

      <!-- Real Processing Module Active Badge -->
      <div class="demo-mode-badge" style="background-color: rgba(212, 175, 55, 0.15); border-color: rgba(212, 175, 55, 0.5); color: #f5e298;" title="Independent SIFT Registration Processing Engine">
        <span class="badge-pulse-indicator" style="background-color: #d4af37;"></span>
        <span class="badge-text" style="color: #f5e298;">PROCESSING SUBSYSTEM • SIFT + RANSAC PIPELINE</span>
      </div>

      <!-- Header Telemetry & Navigation Utilities -->
      <div class="header-telemetry-group">
        <div class="telemetry-item">
          <span class="telemetry-label">MISSION TIME</span>
          <span class="telemetry-val highlight" id="utcClock">UTC --:--:--</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">SUBSYSTEM</span>
          <span class="telemetry-val">PROC-02</span>
        </div>
        <a href="/input" class="header-action-btn" title="Go to Input Module">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>INPUT MODULE</span>
        </a>
        <a href="/" class="header-action-btn" title="Educational Feature Matching Demo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>DEMO VIEW</span>
        </a>
        <a href="/test-runner" class="header-action-btn" title="Automated Component Test Runner">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>TEST RUNNER</span>
        </a>
      </div>
    </header>

    <!-- Main Workspace Area hosting Processing Module -->
    <main style="flex: 1; overflow-y: auto; padding: 24px 16px;">
      <div id="processingModuleMount"></div>
    </main>

  </div>

  <!-- Component Scripts -->
  <script src="js/components/ProcessingModule.js"></script>

  <script>
    // Live Mission Clock in UTC
    function updateMissionClock() {
      const now = new Date();
      const h = String(now.getUTCHours()).padStart(2, '0');
      const m = String(now.getUTCMinutes()).padStart(2, '0');
      const s = String(now.getUTCSeconds()).padStart(2, '0');
      const el = document.getElementById('utcClock');
      if (el) el.textContent = `UTC ${h}:${m}:${s}`;
    }
    setInterval(updateMissionClock, 1000);
    updateMissionClock();

    // Initialize Processing Module
    document.addEventListener('DOMContentLoaded', () => {
      const processingModule = new ProcessingModule({
        container: '#processingModuleMount',
        apiEndpoint: '/api/v1/registration/process',
        onComplete: (data) => {
          console.log('[LUNA-REG] Registration successfully executed:', data);
        },
        onProceedToOutput: (data) => {
          console.log('[LUNA-REG] Ready for Output Module delivery:', data);
          alert('Output Contract generated successfully! Handing off to Output Module with 6 visual verification artifacts.');
        }
      });
      processingModule.render();

      // Expose globally for testing / integration
      window.lunaProcessingModule = processingModule;
    });
  </script>
</body>
</html>
