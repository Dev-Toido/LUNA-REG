<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA-REG — Mission Image Output Module</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mission_hud.css">
  <link rel="stylesheet" href="css/output_module.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Mission Control Header -->
    <header class="mission-header">
      <div class="brand-section">
        <div class="mission-crest" title="ISRO Lunar Surface Mission Control">
          <span class="crest-moon">☽</span>
        </div>
        <div class="brand-titles">
          <div class="brand-title-row">
            <span class="brand-name">LUNA-REG</span>
            <span class="brand-sub">Mission Image Output Module</span>
          </div>
        </div>
      </div>

      <!-- Output Module Active Badge -->
      <div class="demo-mode-badge" style="background-color: rgba(76, 175, 80, 0.15); border-color: rgba(76, 175, 80, 0.5); color: #a5d6a7;" title="Registration Output Subsystem">
        <span class="badge-pulse-indicator" style="background-color: #66bb6a;"></span>
        <span class="badge-text" style="color: #a5d6a7;">OUTPUT SUBSYSTEM • RESULTS &amp; EXPORT</span>
      </div>

      <!-- Header Telemetry & Navigation Utilities -->
      <div class="header-telemetry-group">
        <div class="telemetry-item">
          <span class="telemetry-label">MISSION TIME</span>
          <span class="telemetry-val highlight" id="utcClock">UTC --:--:--</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">SUBSYSTEM</span>
          <span class="telemetry-val">OUT-03</span>
        </div>
        <a href="/input" class="header-action-btn" title="Go to Input Module">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          <span>INPUT MODULE</span>
        </a>
        <a href="/processing" class="header-action-btn" title="Go to Processing Module">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>PROCESSING</span>
        </a>
        <a href="/" class="header-action-btn" title="Educational Feature Matching Demo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>DEMO VIEW</span>
        </a>
        <a href="/test-runner" class="header-action-btn" title="Automated Component Test Runner">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>TEST RUNNER</span>
        </a>
      </div>
    </header>

    <!-- Main Workspace Area hosting Output Module -->
    <main style="flex: 1; overflow-y: auto; padding: 24px 16px;">
      <div id="outputModuleMount"></div>
    </main>

  </div>

  <!-- Component Scripts -->
  <script src="js/components/OutputModule.js"></script>

  <script>
    // Live Mission Clock in UTC
    function updateMissionClock() {
      const now = new Date();
      const h = String(now.getUTCHours()).padStart(2, '0');
      const m = String(now.getUTCMinutes()).padStart(2, '0');
      const s = String(now.getUTCSeconds()).padStart(2, '0');
      const el = document.getElementById('utcClock');
      if (el) el.textContent = `UTC ${h}:${m}:${s}`;
    }
    setInterval(updateMissionClock, 1000);
    updateMissionClock();

    // Initialize Output Module
    document.addEventListener('DOMContentLoaded', () => {
      const outputModule = new OutputModule({
        container: '#outputModuleMount',
        onBackToInput: () => { window.location.href = '/input'; },
        onBackToProcessing: () => { window.location.href = '/processing'; }
      });
      outputModule.render();
      outputModule.checkForUrlParams();

      // Expose globally for testing & console integration
      window.lunaOutputModule = outputModule;
    });
  </script>
</body>
</html>
