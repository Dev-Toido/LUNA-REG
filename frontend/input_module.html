<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA-REG — Mission Image Input Module</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mission_hud.css">
  <link rel="stylesheet" href="css/input_module.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Mission Control Header -->
    <header class="mission-header">
      <div class="brand-section">
        <div class="mission-crest" title="ISRO Lunar Surface Mission Control">
          <span class="crest-moon">☽</span>
        </div>
        <div class="brand-titles">
          <div class="brand-title-row">
            <span class="brand-name">LUNA-REG</span>
            <span class="brand-sub">Mission Image Input Module</span>
          </div>
        </div>
      </div>

      <!-- Real Input Module Live Badge -->
      <div class="demo-mode-badge" style="background-color: rgba(212, 175, 55, 0.15); border-color: rgba(212, 175, 55, 0.5); color: #f5e298;" title="Manual File Staging System">
        <span class="badge-pulse-indicator" style="background-color: #4caf50;"></span>
        <span class="badge-text" style="color: #f5e298;">INPUT SUBSYSTEM • MANUAL FILE SELECTION</span>
      </div>

      <!-- Header Telemetry & Quick Utilities -->
      <div class="header-telemetry-group">
        <div class="telemetry-item">
          <span class="telemetry-label">MISSION TIME</span>
          <span class="telemetry-val highlight" id="utcClock">UTC --:--:--</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">SECTOR</span>
          <span class="telemetry-val">SOUTH POLAR 78°S</span>
        </div>
        <a href="/processing" class="header-action-btn" title="Go to SIFT Processing Module">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <span>PROCESSING MODULE</span>
        </a>
        <a href="/output" class="header-action-btn" title="Go to Output Module">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <span>OUTPUT MODULE</span>
        </a>
        <a href="/" class="header-action-btn" title="Switch to Educational Feature Matching Demo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>DEMO VIEW</span>
        </a>
        <a href="/test-runner" class="header-action-btn" title="Automated Component Test Runner">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>TEST RUNNER</span>
        </a>
      </div>
    </header>

    <!-- Main Workspace Area hosting Input Module -->
    <main style="flex: 1; overflow-y: auto; padding: 24px 16px;">
      <div id="inputModuleMount"></div>
    </main>

  </div>

  <!-- Component Scripts -->
  <script src="js/components/FileValidationMessage.js"></script>
  <script src="js/components/FileMetadata.js"></script>
  <script src="js/components/FilePreview.js"></script>
  <script src="js/components/FileUploadCard.js"></script>
  <script src="js/components/InputModule.js"></script>

  <script>
    // Live Mission Clock in UTC
    function updateMissionClock() {
      const now = new Date();
      const h = String(now.getUTCHours()).padStart(2, '0');
      const m = String(now.getUTCMinutes()).padStart(2, '0');
      const s = String(now.getUTCSeconds()).padStart(2, '0');
      const el = document.getElementById('utcClock');
      if (el) el.textContent = `UTC ${h}:${m}:${s}`;
    }
    setInterval(updateMissionClock, 1000);
    updateMissionClock();

    // Initialize Input Module
    document.addEventListener('DOMContentLoaded', () => {
      const inputModule = new InputModule({
        container: '#inputModuleMount',
        apiEndpoint: '/api/stage-inputs',
        onProceed: (data) => {
          console.log('[LUNA-REG] InputModule data staged successfully:', data);
        }
      });
      inputModule.render();

      // Expose globally for testing / integration
      window.lunaInputModule = inputModule;
    });
  </script>
</body>
</html>
